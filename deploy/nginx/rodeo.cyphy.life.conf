# RODEO org-web on colossus. Install as /etc/nginx/sites-available/rodeo.cyphy.life
# (symlinked into sites-enabled). Uses the existing *.cyphy.life wildcard cert, like
# iecoin.cyphy.life. org-web listens on 127.0.0.1:8240 (ORG_WEB_PORT in the stack).
server {
    listen 443 ssl;
    server_name rodeo.cyphy.life;
    ssl_certificate /etc/letsencrypt/live/cyphy.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyphy.life/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 20M;
    location / {
        proxy_pass http://127.0.0.1:8240;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;   # chain transactions wait for their receipt
    }
}

server {
    listen 80;
    server_name rodeo.cyphy.life;
    return 301 https://$host$request_uri;
}
