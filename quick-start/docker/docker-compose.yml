# Robot emulator: acceptance test for the bridge (ROS 2).
name: rodeo-robot-emulator

services:
  robot-emulator:
    build:
      context: ../..
      dockerfile: quick-start/docker/Dockerfile
    container_name: robot-emulator
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-40}      # same as the bridge
      - ROBOT_NAMESPACE=${ROBOT_NAMESPACE:-}    # same as the bridge
      - SKIP_REGISTRATION=${SKIP_REGISTRATION:-false}
      - PROOF_FILE=/root/oracle/proofs/task_tid10_20250910_145742.bag
    volumes:
      # same path the oracle container uses, so the file:// URI resolves there
      - ../../oracle/proofs:/root/oracle/proofs:ro
    # no auto-restart: every restart would register another service
    restart: "no"
