# Demo without a robot: the RODEO agent plus a fake executor in place of the
# robot. Uses the Panther's services.yaml (Delivery, nine places), so a task
# runs exactly as it will on the Panther, minus the driving.
name: rodeo-demo

x-common: &common
  build:
    context: ../..
    dockerfile: robot-agent/docker/Dockerfile
  image: rodeo-robot-agent
  network_mode: host
  ipc: host
  volumes:
    - ${SERVICES_FILE:-../../robot-agent/config/panther/services.yaml}:/config/services.yaml:ro
    - ../../oracle/proofs:/root/oracle/proofs

services:
  agent:
    <<: *common
    container_name: rodeo-demo-agent
    command: ["agent"]
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-40}       # same as the bridge
      - ROBOT_NAMESPACE=${ROBOT_NAMESPACE:-}     # same as the bridge
    stop_grace_period: 30s
    restart: unless-stopped

  fake-executor:
    <<: *common
    container_name: rodeo-demo-executor
    command: ["fake-executor"]
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-40}
      - ROBOT_NAMESPACE=${ROBOT_NAMESPACE:-}
      # legacy: also returns the ROS 1 waste-demo bag, which is the only proof
      # today's oracle can validate. Switch to rodeo once the oracle reads
      # RODEO proofs.
      - PROOF_MODE=${PROOF_MODE:-legacy}
    restart: unless-stopped
