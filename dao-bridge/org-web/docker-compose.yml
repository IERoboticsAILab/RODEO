services:
  org-web:
    build:
      context: ../..                      # repo root (for robot-agent's rodeo_common)
      dockerfile: dao-bridge/org-web/Dockerfile
      args:
        # baked into the client bundle at build time
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
    container_name: org-web-console
    ports:
      - "${HOST_PORT:-8080}:80"
    extra_hosts:
      # reach Ganache published on the host (required on Linux)
      - "host.docker.internal:host-gateway"
    environment:
      # Blockchain Configuration
      - RPC_URL=${RPC_URL:-http://localhost:8545}

      # Wallets (MetaMask): the RPC URL as seen from the user's browser, and the
      # local-chain faucet (on by default on chain 1337 only)
      - WALLET_RPC_URL=${WALLET_RPC_URL:-http://localhost:8545}
      - WALLET_CHAIN_NAME=${WALLET_CHAIN_NAME:-RODEO local}
      - DEV_FAUCET=${DEV_FAUCET:-}
      
      # Contract Addresses
      - ORGANIZATION_ADDRESS=${ORGANIZATION_ADDRESS}
      - IECOIN_ADDRESS=${IECOIN_ADDRESS}
      
      # Organization Wallet (for signing transactions)
      - ORGANIZATION_WALLET_PUBLIC=${ORGANIZATION_WALLET_PUBLIC}
      - ORGANIZATION_WALLET_PRIVATE=${ORGANIZATION_WALLET_PRIVATE}
      
      # ABI Configuration
      - ABI_ROOT=${ABI_ROOT:-contracts}
      - ADDRESSES_JSON=${ADDRESSES_JSON:-addresses.json}
      
      # Frontend Configuration
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
      
      # CORS Configuration (optional, nginx handles same-origin)
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      
      # Optional: IECoin deployment block (for optimization)
      - IECOIN_DEPLOY_BLOCK=${IECOIN_DEPLOY_BLOCK:-0}
    volumes:
      # Mount contract ABIs (read-only)
      - ./backend/contracts:/app/contracts:ro
      
      # Optional: Mount addresses.json if not using env vars
      # - ./backend/addresses.json:/app/addresses.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - rodeo-network

networks:
  rodeo-network:
    name: rodeo-network
    driver: bridge
